# Persistence Configuration
persistence.mode=file
persistence.db.url=jdbc:sqlite:bank.db
persistence.db.driver=org.sqlite.JDBC
persistence.pool.size=10
persistence.pool.timeout=30000

persistence.file.account.path=data/accounts.csv
persistence.file.transaction.path=data/transactions.csv
persistence.file.backup.enabled=true
persistence.file.backup.max=5

# Async Concurrency & NFR Config
service.async.enabled=true
service.thread.pool.size=10
service.timeout.ms=5000
